apiVersion: apps/v1
kind: Deployment
metadata:
  name: skupper-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skupper-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skupper-mcp-server
    spec:
      serviceAccountName: skupper-mcp-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # A read-only observer has no reason to tolerate a slow exit: the grace
      # period only has to cover in-flight tool calls.
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: skupper-mcp-server:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: skupper-mcp-server
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          # Startup probe first: it gives the process room to complete OIDC
          # discovery and the Kubernetes preflight without liveness killing it.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Starting values, not a sizing promise. Measure your own network's
          # resource count before trusting them.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
