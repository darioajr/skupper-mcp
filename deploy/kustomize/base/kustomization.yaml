apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: skupper-mcp-server
  - includeSelectors: false
    pairs:
      app.kubernetes.io/component: mcp-server
      app.kubernetes.io/part-of: skupper-observability

resources:
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
