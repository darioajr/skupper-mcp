apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skupper-mcp-reader
  namespace: east
rules:
  - apiGroups: ["skupper.io"]
    resources: ["sites", "links", "listeners", "connectors"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skupper-mcp-native-readers
  namespace: east
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skupper-mcp-reader
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: replace-with-existing-native-reader-group
